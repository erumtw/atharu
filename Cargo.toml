[package]
name = "atharu"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
chrono = "0.4.45"
icalendar = { version = "0.17.17", default-features = false, features = ["parser"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Self-hosted, one user: trade build time for a small, lean binary.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The Mac app (T18) is a second crate so the server build (`cargo run`, Docker) never compiles Tauri.
[workspace]
members = [".", "src-tauri"]
