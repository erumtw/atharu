<a class="blk ink nrow" href="/notes/{{ r.id }}">{% if let Some(a) = r.agent %}<span class="chip tag at" title="Written by {{ a }}">{{ a }}</span>{% endif %}{% if let Some(k) = r.kind %}<span class="{{ k.badge_class() }}" title="Linked to a {{ r.kind_name }} line">{{ k.mark() }}</span>{% endif %}<b>{{ r.title }}</b>{% if r.lines > 1 %}<span class="small muted">{{ r.lines }} lines</span>{% endif %}<span class="small muted">{{ r.before }}{% if !r.hit.is_empty() %}<b class="ink">{{ r.hit }}</b>{{ r.after }}{% endif %}</span><span class="small muted" style="margin-left: auto">{{ r.ago }}</span></a>
