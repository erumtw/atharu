{#- One logged line; needs `row` (today::view::Row). Delete works as a plain POST without JS. #}
<div class="blk"><span class="{{ row.kind.badge_class() }}" title="{{ row.kind.tooltip() }}">{{ row.kind.mark() }}</span><span>{% if let Some(t) = row.topic %}<span class="mono">{{ t }}</span> {% endif %}{{ row.text }}</span>{% if let Some(m) = row.meeting %}<span class="chip">{{ m }}</span>{% endif %}<form class="inline" style="margin-left: auto" method="post" action="/entries/{{ row.id }}/delete" hx-delete="/entries/{{ row.id }}" hx-target="#log" hx-swap="outerHTML"><button class="x" type="submit" title="Delete line" aria-label="Delete line">×</button></form></div>
