{#- One logged line; needs `row` (today::view::Row). Delete works as a plain POST without JS. #}
<div class="blk" id="entry-{{ row.id }}"><span class="{{ row.kind.badge_class() }}" title="{{ row.kind.tooltip() }}">{{ row.kind.mark() }}</span><a class="edit-line" href="/?day={{ day.iso }}&amp;edit={{ row.id }}" hx-get="/entries/{{ row.id }}/edit" hx-target="#entry-{{ row.id }}" hx-swap="outerHTML" title="Click to edit">{% if let Some(t) = row.topic %}<span class="mono">{{ t }}</span> {% endif %}{{ row.text }}</a>{% if let Some(m) = row.meeting %}<span class="chip">{{ m }}</span>{% endif %}{% include "partials/author.html" %}<button style="margin-left: auto" class="ib more m-only" type="button" popovertarget="more-e{{ row.id }}" aria-label="More actions for this line"><svg class="ic" aria-hidden="true"><use href="/static/icon/ui.svg#more"/></svg></button><div class="acts m-pop" id="more-e{{ row.id }}" popover><a class="btn ghost s m-only" href="/?day={{ day.iso }}&amp;edit={{ row.id }}" hx-get="/entries/{{ row.id }}/edit" hx-target="#entry-{{ row.id }}" hx-swap="outerHTML">Edit line</a><form class="inline" style="margin-left: auto" method="post" action="/entries/{{ row.id }}/delete" hx-delete="/entries/{{ row.id }}" hx-target="#log" hx-swap="outerHTML"><button class="x" type="submit" title="Delete line" aria-label="Delete line">×<span class="m-only"> Delete line</span></button></form></div></div>
